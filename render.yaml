services:
  - type: web
    name: public-seva-ai-callcentre
    runtime: python
    region: singapore
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app --bind 0.0.0.0:$PORT --workers 2 --timeout 120
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.0"
      - key: SARVAM_KEY
        sync: false
      - key: SARVAM_API_KEY
        sync: false
      - key: SARVAM_TTS_MODEL
        value: "bulbul:v3"
      - key: SARVAM_SPEAKER
        value: "rupali"
      - key: GROQ_API_KEY
        sync: false
      - key: GROQ_MODEL
        value: "openai/gpt-oss-120b"
      - key: GOOGLE_API_KEY
        sync: false
      - key: BASE_URL
        sync: false
